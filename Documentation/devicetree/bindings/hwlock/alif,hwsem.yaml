%YAML 1.2
---
$id: http://devicetree.org/schemas/hwlock/alif,hwsem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Alif Ensemble Hardware Semaphore (HWSEM) Controller

description: Alif Ensemble Hardware Semaphore (HWSEM) controller

maintainers:
  - Hemanth Kumar <hemanth@alifsemi.com>

properties:
  compatible:
    const: alif,hwsem

  reg:
    maxItems: 1
    description: Register address of hardware semaphore.

  reg-names:
    items:
      - const: hwsem_base
    description: Names for the register areas.

  interrupts:
    maxItems: 1
    description: List of interrupt numbers.

  clocks:
    maxItems: 1
    description: Must contain an entry for each entry in clock-names.

  clock-names:
    items:
      - const: syst_pclk
    description: Should be "syst_pclk" to match clocks phandles list.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/alif,ensemble-clock.h>

    hwsem0: hwlock@4902e000 {
        compatible = "alif,hwsem";
        reg = <0x4902e000 0x4>;
        reg-names = "hwsem_base";
        interrupts = <0 30 4>;
        clocks = <&psclks ENSEMBLE_SYST_PCLK>;
        clock-names = "syst_pclk";
    };
