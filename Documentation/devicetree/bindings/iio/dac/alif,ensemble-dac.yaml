%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/dac/alif,ensemble-dac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ALIF Ensemble DAC

description: |
  Schema for the DAC (Digital-to-Analog Converter) nodes found on the ALIF ENSEMBLE SoC.

maintainers:
  - Hemanth Kumar <hemanth@alifsemi.com>

properties:
  compatible:
    const: alif,ensemble-dac

  reg:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: dac_clk
      - const: cmp_clk

required:
  - compatible
  - reg
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/alif,ensemble-clock.h>

    dac12_0: dac@49028000 {
        compatible = "alif,ensemble-dac";
        reg = <0x49028000 0x10>;
        clocks = <&psclks ENSEMBLE_DAC120_CLK>,
                 <&psclks ENSEMBLE_CMP0_CLK>;
        clock-names = "dac_clk", "cmp_clk";
    };

    dac12_1: dac@49029000 {
        compatible = "alif,ensemble-dac";
        reg = <0x49029000 0x10>;
        clocks = <&psclks ENSEMBLE_DAC121_CLK>,
                 <&psclks ENSEMBLE_CMP0_CLK>;
        clock-names = "dac_clk", "cmp_clk";
    };
